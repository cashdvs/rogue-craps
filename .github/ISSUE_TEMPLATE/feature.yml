name: Feature / task
description: Propose a feature or a well-scoped task for one module.
title: "[module] short description"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it to something one PR can deliver (about 400 lines). Check docs/MODULES.md and existing issues first.
        Rules or balance changes need PM's OK (CONTRIBUTING.md §5).
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - table-3d
        - dice-physics
        - feel
        - betting
        - soul
        - run
        - dice-bag
        - table-rules
        - shop
        - map-events
        - bosses
        - embers
        - dealer
        - ui
        - shaders
        - audio
        - fonts
        - art-import
        - qa
        - tools-ci
        - not sure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What and why
      description: What should change, and what problem does it solve for the player or team?
    validations:
      required: true
  - type: input
    id: design_ref
    attributes:
      label: Design doc reference
      description: Design doc and section, if any (see docs/DESIGN_INDEX.md).
      placeholder: "e.g. bonfire_map_events_juice.md §2"
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Relevant files
      description: Files you expect to touch (see docs/MODULES.md).
  - type: textarea
    id: tests
    attributes:
      label: Test expectations
      description: Which checks should be added to tests/test_*.gd?
