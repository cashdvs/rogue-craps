# CI: runs the headless Godot test suite (run_tests.sh) on every PR and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # Scene for the "table scene smoke test" step (runs it directly, bypassing the boot splash).
  TABLE_SCENE: res://scenes/table_3d.tscn
  GODOT_DIR: ${{ github.workspace }}/../godot

jobs:
  tests:
    # Keep this job name stable: branch protection requires the "tests" check.
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless Linux)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Godot version
        run: |
          echo "GODOT=$GODOT_DIR/godot" >> "$GITHUB_ENV"
          "$GODOT_DIR/godot" --headless --version

      - name: Import project
        # Registers class_name scripts and imports assets into .godot/ (fresh checkout).
        # Fails on a non-zero exit, on script/parse errors, or if .godot/ wasn't created.
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::Import reported script errors"; exit 1
          fi
          test -d .godot || { echo "::error::Import did not create .godot/"; exit 1; }

      - name: Run tests
        run: ./run_tests.sh

      - name: Main scene smoke test (headless)
        # Runs the main scene for 300 frames with no display. Fails on a non-zero exit, a hang,
        # or any SCRIPT ERROR / Parse Error in the output.
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . --quit-after 300 2>&1 | tee smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error" smoke.log; then
            echo "::error::Main scene printed script errors"; exit 1
          fi

      - name: Table scene smoke test (headless)
        # Runs $TABLE_SCENE directly for 300 frames (the main-scene step above only reaches the
        # boot splash). Fails on a non-zero exit, a hang, or any SCRIPT ERROR / Parse Error.
        run: |
          set -o pipefail
          timeout 120 "$GODOT" --headless --path . "$TABLE_SCENE" --quit-after 300 2>&1 | tee table_smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error" table_smoke.log; then
            echo "::error::$TABLE_SCENE printed script errors"; exit 1
          fi
