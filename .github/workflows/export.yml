# Export: builds a runnable Windows release (plus a Linux build that gets a headless smoke run)
# from export_presets.cfg and uploads them as workflow artifacts. Separate from ci.yml so the
# required "tests" check is untouched. See docs/STEAM_READINESS.md.
name: Export

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-${{ github.ref }}
  # Cancel superseded PR runs only: back-to-back merges to main each keep their own export.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match ci.yml and the export templates (templates are tied to the exact engine build).
  GODOT_VERSION: "4.7.2"
  GODOT_DIR: ${{ github.workspace }}/../godot
  # The commit being built. On pull_request, github.sha is GitHub's synthetic merge commit, which
  # isn't on the branch, so artifact names and BUILD_INFO.txt use the PR head instead.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  export:
    name: export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same install as ci.yml (same cache key, so the two workflows share the cached editor).
      - name: Cache Godot ${{ env.GODOT_VERSION }}
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-x86_64-v2

      - name: Download Godot ${{ env.GODOT_VERSION }} (headless Linux)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR"
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$release/$file"
          # Verify against SHA512-SUMS.txt from the same release before unpacking (download only;
          # a cache hit skips this step).
          curl -fsSL --retry 3 -o /tmp/SHA512-SUMS.txt "$release/SHA512-SUMS.txt"
          expected="$(awk -v f="$file" '$2 == f { print $1 }' /tmp/SHA512-SUMS.txt)"
          test -n "$expected" || { echo "::error::$file is not listed in SHA512-SUMS.txt"; exit 1; }
          echo "$expected  /tmp/godot.zip" | sha512sum -c - || { echo "::error::$file failed its SHA-512 check"; exit 1; }
          unzip -q -o /tmp/godot.zip -d "$GODOT_DIR"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Set build env (paths, print Godot version)
        run: |
          echo "GODOT=$GODOT_DIR/godot" >> "$GITHUB_ENV"
          echo "TEMPLATES_DIR=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" >> "$GITHUB_ENV"
          "$GODOT_DIR/godot" --headless --version

      # The full .tpz is ~1.3 GB; only the x86_64 Windows and Linux templates (~360 MB) are kept and cached.
      - name: Cache export templates ${{ env.GODOT_VERSION }}
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-stable-win64-linux64-v2

      - name: Download export templates ${{ env.GODOT_VERSION }}
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$release/$file"
          # Verify against SHA512-SUMS.txt from the same release before extracting (download only;
          # a cache hit skips this step).
          curl -fsSL --retry 3 -o /tmp/SHA512-SUMS.txt "$release/SHA512-SUMS.txt"
          expected="$(awk -v f="$file" '$2 == f { print $1 }' /tmp/SHA512-SUMS.txt)"
          test -n "$expected" || { echo "::error::$file is not listed in SHA512-SUMS.txt"; exit 1; }
          echo "$expected  /tmp/templates.tpz" | sha512sum -c - || { echo "::error::$file failed its SHA-512 check"; exit 1; }
          mkdir -p "$TEMPLATES_DIR"
          unzip -q -j -o /tmp/templates.tpz \
            templates/version.txt \
            'templates/windows_release_x86_64*' 'templates/windows_debug_x86_64*' \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            -d "$TEMPLATES_DIR"
          rm /tmp/templates.tpz
          test "$(cat "$TEMPLATES_DIR/version.txt")" = "${GODOT_VERSION}.stable"

      - name: Stamp build version
        # application/config/version (x.y.z) is the hand-bumped source of truth. CI appends the run
        # number as a 4th part (Windows file/product versions must be numeric x.y.z.w). The stamp only
        # changes this runner's checkout; nothing is committed.
        run: |
          set -euo pipefail
          base="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          test -n "$base" || { echo "::error::application/config/version missing from project.godot"; exit 1; }
          ver="${base}.${GITHUB_RUN_NUMBER}"
          sed -i "s/^config\/version=\".*\"$/config\/version=\"${ver}\"/" project.godot
          echo "BUILD_VERSION=$ver" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${BUILD_SHA::7}" >> "$GITHUB_ENV"
          echo "Build version: $ver (${BUILD_SHA::7})"

      - name: Import project
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --import 2>&1 | tee import.log
          if grep -qE "SCRIPT ERROR|Parse Error" import.log; then
            echo "::error::Import reported script errors"; exit 1
          fi

      - name: Export Windows Desktop (release)
        run: |
          set -o pipefail
          mkdir -p build/windows
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/DiceOfTheDamned.exe 2>&1 | tee export_windows.log
          test -s build/windows/DiceOfTheDamned.exe || { echo "::error::No Windows build produced"; exit 1; }
          printf 'Dice of the Damned %s\ncommit %s\nGodot %s\n' "$BUILD_VERSION" "$BUILD_SHA" "$GODOT_VERSION" > build/windows/BUILD_INFO.txt
          ls -la build/windows

      - name: Export Linux (release)
        run: |
          set -o pipefail
          mkdir -p build/linux
          "$GODOT" --headless --path . --export-release "Linux" build/linux/DiceOfTheDamned.x86_64 2>&1 | tee export_linux.log
          test -s build/linux/DiceOfTheDamned.x86_64 || { echo "::error::No Linux build produced"; exit 1; }
          printf 'Dice of the Damned %s\ncommit %s\nGodot %s\n' "$BUILD_VERSION" "$BUILD_SHA" "$GODOT_VERSION" > build/linux/BUILD_INFO.txt
          ls -la build/linux

      - name: Smoke-run the exported Linux build (headless)
        # Runs the exported binary (not the editor) for 900 frames: catches files the export
        # filter left out and anything that only breaks in an exported build.
        run: |
          set -o pipefail
          timeout 120 build/linux/DiceOfTheDamned.x86_64 --headless --quit-after 900 2>&1 | tee export_smoke.log
          if grep -qE "SCRIPT ERROR|Parse Error|Cannot open file|Failed loading resource" export_smoke.log; then
            echo "::error::Exported build printed errors"; exit 1
          fi

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DiceOfTheDamned-windows-${{ env.BUILD_VERSION }}-${{ env.SHORT_SHA }}
          path: build/windows/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: DiceOfTheDamned-linux-${{ env.BUILD_VERSION }}-${{ env.SHORT_SHA }}
          path: build/linux/
          if-no-files-found: error
          retention-days: 14
