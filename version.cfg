; Single source of truth for the build version (0.1.<patch>). Bump patch
; for a release; tools/stamp_version.sh copies it into export_presets.cfg
; and project.godot and writes the git short sha here before an export.
; In dev the sha stays "dev".
[version]
major_minor="0.1"
patch=2
sha="dev"
; Dev tools (the sandbox launcher): true for beta review builds, false
; for public releases. stamp_version.sh leaves it as is.
dev_tools=true
